services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: desy_nails
      MYSQL_ROOT_PASSWORD: desy_dev
    ports:
      - "3306:3306"
    volumes:
      - desy_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  desy_mysql:
